<nav class="breadcrumbs" aria-label="breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">首页</a></li>
    {% if page.date %}
    <li><a href="{{ page.date | date: '/%Y/%m/' | relative_url }}">{{ page.date | date: "%Y-%m-%d" }}</a></li>
    {% endif %}
    {% if page.title %}
    <li class="active">{{ page.title | truncate: 50 }}</li>
    {% endif %}
  </ol>
</nav>
