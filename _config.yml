title: Linux 内核调度子系统 LKML 日报
description: 每日自动分析 kernel/sched/* 邮件列表，生成补丁系列摘要与跟踪报告
baseurl: "/lkm"
url: "https://1343503048.github.io"

markdown: kramdown

# 排除原始数据和构建产物
exclude:
  - references/
  - scripts/
  - sched/
  - Gemfile*
  - vendor/
  - node_modules/
  - README.md
  - "*.py"
  - "*.sh"
  - posts/_daily/

# 包含预处理生成的目录
include:
  - posts/
  - pages/
  - assets/

# 文章集合
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title:output_ext

# 默认 layout
defaults:
  - scope:
      path: "posts/_posts"
      type: "posts"
    values:
      layout: "article"
  - scope:
      path: "pages"
    values:
      layout: "default"

# 每页文章数
paginate: 30
paginate_path: "/page:num/"
